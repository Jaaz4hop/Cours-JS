<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>
<body>
    <section id="showroomContainer">
        <div id="leftArrow">
            <img src="asset/img/arrow_left.png" alt="left arrow">
        </div>
        <div id="faceContainer">
            <img src="asset/img/face-1.png" alt="face" id="faceImg">
        </div>
        <div id="rightArrow">
            <img src="asset/img/arrow_right.png" alt="right arrow">
        </div>
    </section>
    <section id="colorContainer">
        <h2>Couleur des cheveux</h2>
        <div id="colorPicker">
            <div id="blackColor"></div>
            <div id="yellowColor"></div>
            <div id="cyanColor"></div>
        </div>
    </section>
</body>
</html>
